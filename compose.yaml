name: project-foundation

services:
  documentation-check:
    image: node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        tar \
          --exclude=.git \
          --exclude=node_modules \
          --exclude=dist \
          --exclude=.astro \
          --exclude=.nimbus \
          --exclude=.wrangler \
          --exclude=docs-nimbus/src/content/docs \
          -C /source -cf - . | tar -C /workspace -xf -
        npm ci --prefix docs-nimbus --ignore-scripts --no-audit --no-fund
        npm run check --prefix docs-nimbus
    volumes:
      - type: bind
        source: .
        target: /source
        read_only: true
      - type: volume
        target: /workspace
    labels:
      foundation.lifecycle: job
