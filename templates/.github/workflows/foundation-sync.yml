name: Foundation Current

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check current Foundation release
        run: python3 scripts/foundation_sync.py check
