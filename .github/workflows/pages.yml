name: Publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-nimbus/package-lock.json

      - name: Install Nimbus dependencies
        run: npm ci --prefix docs-nimbus --ignore-scripts --no-audit --no-fund

      - name: Build public documentation
        env:
          NIMBUS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NIMBUS_DESCRIPTION: Common technical and delivery rules for software projects.
          NIMBUS_GITHUB: ${{ github.server_url }}/${{ github.repository }}
          NIMBUS_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NIMBUS_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          NIMBUS_TITLE: Project Foundation
          NIMBUS_VISIBILITIES: public,reference
        run: npm run build:publication --prefix docs-nimbus

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-nimbus/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
