name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'

      - name: Verify foundation
        run: ./scripts/verify.sh

      - name: Verify annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/verify.sh --release
