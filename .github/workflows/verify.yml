name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-nimbus/package-lock.json

      - name: Check Docker Compose
        run: |
          docker compose version
          python3 scripts/check_compose.py

      - name: Verify foundation
        run: ./scripts/verify.sh

      - name: Verify public documentation artifact
        env:
          NIMBUS_BASE_PATH: /project-foundation
          NIMBUS_SITE_ORIGIN: https://nclsppr.github.io
          NIMBUS_SOURCE_URL: https://github.com/nclsppr/project-foundation/blob/${{ github.sha }}
          NIMBUS_VISIBILITIES: public,reference
        run: npm run build:publication --prefix docs-nimbus

      - name: Verify documentation through Compose
        run: docker compose run --rm documentation-check

      - name: Verify annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/verify.sh --release
